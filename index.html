<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXO Channel Reaction</title>
    <!-- Font & Ikon -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fab fa-whatsapp"></i>
                <span>AXO Reaction</span>
            </div>
            <div class="badge">v1.0</div>
        </div>

        <!-- Hero -->
        <div class="hero">
            <h1>Kirim Reaction ke Channel</h1>
            <p>Masukkan link postingan dan pilih emoji untuk mengirim reaksi</p>
        </div>

        <!-- Form -->
        <form id="reactionForm">
            <div class="input-group">
                <label for="link">
                    <i class="fas fa-link"></i> Link Postingan
                </label>
                <input
                    type="url"
                    id="link"
                    placeholder="https://whatsapp.com/channel/..."
                    required
                />
            </div>

            <div class="input-group">
                <label for="emoji">
                    <i class="fas fa-smile"></i> Emoji Reaction
                </label>
                <div class="emoji-wrapper">
                    <input
                        type="text"
                        id="emoji"
                        placeholder="❤️ 🔥 👍 👏"
                        required
                    />
                    <div class="emoji-picker" id="emojiPicker">
                        <button type="button" data-emoji="❤️">❤️</button>
                        <button type="button" data-emoji="🔥">🔥</button>
                        <button type="button" data-emoji="👍">👍</button>
                        <button type="button" data-emoji="👏">👏</button>
                        <button type="button" data-emoji="😍">😍</button>
                        <button type="button" data-emoji="😂">😂</button>
                        <button type="button" data-emoji="🥺">🥺</button>
                        <button type="button" data-emoji="💯">💯</button>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> Kirim Reaction
            </button>
        </form>

        <!-- Result -->
        <div id="result" class="result hidden">
            <div class="result-icon" id="resultIcon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="result-text" id="resultText">Berhasil dikirim!</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Token aman — tidak pernah dikirim ke browser</p>
            <p class="status" id="statusIndicator">
                <i class="fas fa-circle"></i> API: <span id="statusText">Memeriksa...</span>
            </p>
        </div>
    </div>

    <script>
        // ============================================
        // SISTEM TETAP SAMA — HANYA TAMBAHAN UI PREMIUM
        // ============================================

        // --- 1. Emoji Picker ---
        document.querySelectorAll('.emoji-picker button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('emoji').value = btn.dataset.emoji;
            });
        });

        // --- 2. Submit Form (Sistem Asli) ---
        const form = document.getElementById('reactionForm');
        const resultDiv = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const resultIcon = document.getElementById('resultIcon');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const link = document.getElementById('link').value.trim();
            const emoji = document.getElementById('emoji').value.trim();

            // Validasi
            if (!link || !emoji) {
                showResult(false, 'Link dan emoji wajib diisi!');
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';
            resultDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/react', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ link, emoji })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult(true, data.message || '✅ Reaction berhasil dikirim!');
                } else {
                    showResult(false, data.error || '❌ Gagal mengirim reaction.');
                }
            } catch (error) {
                showResult(false, '❌ Terjadi kesalahan jaringan.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Reaction';
            }
        });

        // --- 3. Fungsi Tampilkan Hasil ---
        function showResult(success, message) {
            resultDiv.classList.remove('hidden', 'success', 'error');
            resultDiv.classList.add(success ? 'success' : 'error');

            resultIcon.innerHTML = success
                ? '<i class="fas fa-check-circle"></i>'
                : '<i class="fas fa-times-circle"></i>';

            resultText.textContent = message;
        }

        // --- 4. Cek Status API (Sistem Asli) ---
        async function checkStatus() {
            const statusText = document.getElementById('statusText');
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                statusText.textContent = data.status === 'ok' ? 'Online ✅' : 'Offline ❌';
                statusText.style.color = data.status === 'ok' ? '#22c55e' : '#ef4444';
            } catch {
                statusText.textContent = 'Tidak terhubung ❌';
                statusText.style.color = '#ef4444';
            }
        }

        // Jalankan cek status saat halaman dimuat
        checkStatus();
        // Cek ulang setiap 30 detik
        setInterval(checkStatus, 30000);
    </script>

</body>
</html>
